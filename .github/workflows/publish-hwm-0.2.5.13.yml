name: Publish HWM 0.2.5.13 Stable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-hwm-0.2.5.13.yml'

permissions:
  contents: write

env:
  RELEASE_VERSION: '0.2.5.13'
  SERVICE_VERSION: '0.2.5.10'
  TRAY_VERSION: '1.0.0.9'

jobs:
  publish-stable:
    runs-on: windows-latest

    steps:
      - name: Checkout public update feed
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private HWM source
        uses: actions/checkout@v4
        with:
          repository: Quantumrooster/HWM
          ref: feature/managed-updater-v2
          token: ${{ secrets.HWM_PRIVATE_READ_TOKEN }}
          path: _hwm

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build verified HWM payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet publish _hwm/ServiceProject/HeadlineWorkstationService.csproj -c Release -r win-x64 --self-contained true -o _out/service
          dotnet publish _hwm/HeadlineWorkstationMonitor/HeadlineWorkstationMonitor.csproj -c Release -r win-x64 --self-contained true -o _out/tray

          $serviceExe = Join-Path $PWD '_out/service/HeadlineWorkstationService.exe'
          $trayExe = Join-Path $PWD '_out/tray/HeadlineWorkstationMonitor.exe'
          if (-not (Test-Path $serviceExe)) { throw 'Published HWM service executable not found.' }
          if (-not (Test-Path $trayExe)) { throw 'Published HWM tray executable not found.' }

          $serviceFileVersion = (Get-Item $serviceExe).VersionInfo.FileVersion
          $trayFileVersion = (Get-Item $trayExe).VersionInfo.FileVersion
          if ($serviceFileVersion -notlike "$env:SERVICE_VERSION*") { throw "Unexpected HWM service version: $serviceFileVersion" }
          if ($trayFileVersion -notlike "$env:TRAY_VERSION*") { throw "Unexpected HWM tray version: $trayFileVersion" }

          $releaseDir = Join-Path $PWD 'feed/releases'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $zipName = "Headline-HWM-Service-v$env:RELEASE_VERSION.zip"
          $zipPath = Join-Path $releaseDir $zipName
          Compress-Archive -Path @($serviceExe, $trayExe) -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToUpperInvariant()
          $size = (Get-Item $zipPath).Length
          if ($size -ge 104857600) { throw "Release package is too large for GitHub: $size bytes" }

          $published = (Get-Date).ToUniversalTime().ToString('o')
          $packageUrl = "https://quantumrooster.github.io/HWM-Updates/releases/$zipName"
          $notes = 'HWM 0.2.5.13 contains service 0.2.5.10 and tray 1.0.0.9. Diagnostics from tray 1.0.0.8 showed the first native MainForm handle was created successfully but the first SetVisibleCore(true) did not return, after which the watchdog restarted the tray and the next open succeeded. Tray 1.0.0.9 stages the first visible transition by making an empty native form visible first and then reattaching the already-built UI tree after native visibility has completed. This targets the exact observed first-open hang boundary while preserving collected UI state. Existing ShowInTaskbar and Resize guards, updater verification, rollback, terminal and Mesh recovery behaviour remain unchanged.'

          foreach ($channel in @('pilot', 'stable')) {
            $manifest = [ordered]@{
              schemaVersion = 1
              channel = $channel
              releaseVersion = $env:RELEASE_VERSION
              publishedUtc = $published
              urgent = $true
              allowDowngrade = $false
              minimumUpdaterVersion = '0.1.2.0'
              releaseNotes = $notes
              components = [ordered]@{
                hwmServiceVersion = $env:SERVICE_VERSION
                hwmTrayVersion = $env:TRAY_VERSION
                hcsAutomationVersion = ''
              }
              package = [ordered]@{
                url = $packageUrl
                sha256 = $hash
                sizeBytes = $size
              }
            }

            $channelDir = Join-Path $PWD "feed/$channel"
            New-Item -ItemType Directory -Path $channelDir -Force | Out-Null
            $manifest | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $channelDir "$channel.json") -Encoding UTF8
          }

          Write-Host "Built HWM $env:RELEASE_VERSION"
          Write-Host "Service: $serviceFileVersion"
          Write-Host "Tray: $trayFileVersion"
          Write-Host "SHA256: $hash"
          Write-Host "Size: $size"

      - name: Commit Stable and Pilot release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'Headline HWM Release Bot'
          git config user.email '248761542+Quantumrooster@users.noreply.github.com'
          git add "feed/releases/Headline-HWM-Service-v$env:RELEASE_VERSION.zip" feed/stable/stable.json feed/pilot/pilot.json

          if (git diff --cached --quiet) {
            Write-Host 'HWM 0.2.5.13 is already published.'
            exit 0
          }

          git commit -m "release: publish HWM $env:RELEASE_VERSION to Pilot and Stable"
          git pull --rebase origin main
          git push origin HEAD:main
