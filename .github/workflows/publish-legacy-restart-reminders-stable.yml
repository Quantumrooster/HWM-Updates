name: Validate legacy Stable updater bridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'feed/stable/stable.json'
      - '.github/workflows/*stable*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            feed/stable
            feed/updater/stable.json
      - name: Enforce updater-first legacy Stable migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content feed/stable/stable.json -Raw | ConvertFrom-Json
          $updater = Get-Content feed/updater/stable.json -Raw | ConvertFrom-Json

          if ($manifest.schemaVersion -ne 1 -or $manifest.channel -ne 'stable') {
            throw 'Legacy Stable manifest identity is invalid.'
          }
          if ($manifest.minimumUpdaterVersion -ne '0.1.2.0') {
            throw 'Legacy Stable must remain readable by the installed legacy updater.'
          }
          if ($manifest.components.hwmServiceVersion -ne '0.2.5.20' -or
              $manifest.components.hwmTrayVersion -ne '' -or
              $manifest.components.hcsAutomationVersion -ne '') {
            throw 'Legacy Stable may only carry the service-only updater bridge.'
          }
          if ($manifest.package.url -notmatch '/stable/Headline-HWM-Stable-Bridge-v0\.2\.5\.29\.zip$') {
            throw 'Legacy Stable package is not the immutable updater bridge.'
          }
          if ($updater.version -ne '0.1.5.0') {
            throw 'The verified updater bootstrap catalog changed; run a controlled updater canary first.'
          }

          $package = 'feed/stable/Headline-HWM-Stable-Bridge-v0.2.5.29.zip'
          if ((Get-Item $package).Length -ne $manifest.package.sizeBytes -or
              (Get-FileHash $package -Algorithm SHA256).Hash -ne $manifest.package.sha256) {
            throw 'The immutable updater bridge package does not match its manifest.'
          }

          $expanded = Join-Path $env:RUNNER_TEMP 'legacy-stable-bridge'
          Expand-Archive -LiteralPath $package -DestinationPath $expanded
          $files = @(Get-ChildItem $expanded -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'HeadlineWorkstationService.exe') {
            throw 'Legacy Stable bridge must not contain a tray executable.'
          }
