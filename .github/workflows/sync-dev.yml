name: Sync Latest HWM DEV Release

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PRIVATE_REPO: Quantumrooster/HWM
  PRIVATE_WORKFLOW: hwm-dev-release.yml
  PRIVATE_BRANCH: feature/managed-updater-v2

concurrency:
  group: hwm-dev-sync
  cancel-in-progress: true

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public update feed
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate private repository token
        shell: bash
        env:
          HWM_PRIVATE_READ_TOKEN: ${{ secrets.HWM_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$HWM_PRIVATE_READ_TOKEN" ]; then
            echo 'HWM_PRIVATE_READ_TOKEN is not configured.' >&2
            exit 1
          fi

      - name: Locate latest successful private DEV build
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HWM_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${PRIVATE_REPO}/actions/workflows/${PRIVATE_WORKFLOW}/runs?branch=${PRIVATE_BRANCH}&status=success&per_page=10"
          runs=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")

          run_id=$(echo "$runs" | jq -r '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo 'No successful private HWM DEV workflow run was found.' >&2
            exit 1
          fi

          artifacts=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${PRIVATE_REPO}/actions/runs/${run_id}/artifacts?per_page=100")

          artifact_id=$(echo "$artifacts" | jq -r '[.artifacts[] | select(.expired == false and (.name | startswith("HWM-DEV-")))] | first | .id // empty')
          artifact_name=$(echo "$artifacts" | jq -r '[.artifacts[] | select(.expired == false and (.name | startswith("HWM-DEV-")))] | first | .name // empty')
          if [ -z "$artifact_id" ]; then
            echo "No HWM-DEV artifact was found for workflow run ${run_id}." >&2
            exit 1
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "Using ${artifact_name} from private run ${run_id}."

      - name: Download and extract private DEV artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HWM_PRIVATE_READ_TOKEN }}
          ARTIFACT_ID: ${{ steps.latest.outputs.artifact_id }}
        run: |
          set -euo pipefail
          rm -rf _private _extract
          mkdir -p _private _extract
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o _private/artifact.zip \
            "https://api.github.com/repos/${PRIVATE_REPO}/actions/artifacts/${ARTIFACT_ID}/zip"
          unzip -q _private/artifact.zip -d _extract

      - name: Validate and stage DEV feed
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find _extract -type f -name 'dev.json' -print -quit)
          package=$(find _extract -type f -name 'Headline-HWM-Service-v*-DEV.zip' -print -quit)

          if [ -z "$manifest" ] || [ -z "$package" ]; then
            echo 'Expected dev.json and HWM DEV service package were not present in the private artifact.' >&2
            exit 1
          fi

          expected_name=$(jq -r '.package.url // empty' "$manifest")
          expected_hash=$(jq -r '.package.sha256 // empty' "$manifest" | tr '[:lower:]' '[:upper:]')
          expected_size=$(jq -r '.package.sizeBytes // empty' "$manifest")
          actual_name=$(basename "$package")
          actual_hash=$(sha256sum "$package" | awk '{print toupper($1)}')
          actual_size=$(stat -c%s "$package")

          [ "$expected_name" = "$actual_name" ] || { echo 'Manifest package name mismatch.' >&2; exit 1; }
          [ "$expected_hash" = "$actual_hash" ] || { echo 'Manifest SHA256 mismatch.' >&2; exit 1; }
          [ "$expected_size" = "$actual_size" ] || { echo 'Manifest package size mismatch.' >&2; exit 1; }

          mkdir -p feed/dev
          find feed/dev -maxdepth 1 -type f \( -name 'dev.json' -o -name 'Headline-HWM-Service-v*-DEV.zip' \) -delete
          cp "$manifest" feed/dev/dev.json
          cp "$package" "feed/dev/$actual_name"

          release_version=$(jq -r '.releaseVersion' feed/dev/dev.json)
          printf 'Headline HWM DEV update channel.\nCurrent release: %s\n' "$release_version" > feed/dev/README.txt

      - name: Commit feed only when release changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Headline HWM Release Bot'
          git config user.email '248761542+Quantumrooster@users.noreply.github.com'
          git add feed/dev
          if git diff --cached --quiet; then
            echo 'Public DEV feed is already current.'
          else
            version=$(jq -r '.releaseVersion' feed/dev/dev.json)
            git commit -m "release: publish HWM ${version} DEV feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R feed/. _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Headline HWM Update Feed</title></head>
          <body><h1>Headline HWM Update Feed</h1><p>Managed update service for Headline Workstation Monitor.</p></body></html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
